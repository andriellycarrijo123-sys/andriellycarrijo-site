<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
  <main class="hero" style="min-height:100vh;display:grid;place-items:center;text-align:center">
    <div class="wrap">
      <p class="eyebrow">Erro 404</p>
      <h1>Página <em>não encontrada</em></h1>
      <p class="lede" style="margin-inline:auto">O endereço que você acessou não existe ou foi movido.</p>
      <a class="btn btn--primary" href="/">Voltar ao início</a>
    </div>
  </main>
</body>
</html>
